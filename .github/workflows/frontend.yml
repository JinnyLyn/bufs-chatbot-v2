name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Advisory for now, deliberately. Direct dependencies are pinned in package.json
      # and Dependabot bumps them, but nothing surfaced TRANSITIVE advisories on a PR —
      # they were only visible by running npm audit by hand. As of this change the tree
      # carries three high-rated transitive findings (brace-expansion, js-yaml, nanoid),
      # all DoS in build/lint tooling with no path from an HTTP request to the deployed
      # app, so making this blocking today would fail every PR for issues that do not
      # affect production. Clear that backlog, then drop continue-on-error and let it
      # gate — same ratchet quality.yml documents for its own checks.
      - name: npm audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
