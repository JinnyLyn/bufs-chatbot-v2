name: Unit Tests

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly canary: every Monday at 06:00 UTC
    - cron: '0 6 * * 1'

jobs:
  unit:
    name: Offline unit tests (Python 3.14)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Match the Python version used in the project (see Dockerfile / README)
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}-minimal
          restore-keys: |
            ${{ runner.os }}-pip-minimal-

      - name: Install test dependencies (minimal — no torch/sentence-transformers)
        # requirements-dev.txt is the single source of truth for the unit-test
        # subset.  Full requirements.txt (~4 GB torch/sentence-transformers) is
        # only needed for integration/production installs.
        run: pip install -r requirements-dev.txt

      - name: Run offline unit tests with coverage
        run: |
          pytest -m "not integration" \
            --cov=project \
            --cov-report=term \
            --cov-fail-under=18 \
            -v

  # Integration tests deliberately do NOT run in CI any more.
  #
  # They need a live Ollama + Qdrant, which only the lab GPU box has, so this job used
  # to run on a SELF-HOSTED runner gated by `if: github.event_name == 'workflow_dispatch'`.
  # That guard does not hold on a public repository. A `pull_request` run executes the
  # workflow file from the PR's MERGE COMMIT — a file the fork author controls — so an
  # outside contributor can simply delete the guard, or add a brand-new workflow with
  # `on: pull_request` and `runs-on: self-hosted`, and reach the machine. The repository
  # setting that stands in the way is "require approval for first-time contributors",
  # which stops only the FIRST pull request from a given account.
  #
  # Self-hosted runners are not ephemeral, so untrusted code that lands on one can
  # persist there. GitHub's guidance is not to attach them to public repositories at all.
  #
  # Run the integration suite locally on the box instead:
  #
  #     pytest -m integration -v
  #
  # (needs OLLAMA_BASE_URL and QDRANT_DB_PATH set; see MIGRATION_H100.md)
  #
  # Do not reintroduce `runs-on: self-hosted` here while this repository is public.
