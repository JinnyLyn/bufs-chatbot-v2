name: Unit Tests

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly canary: every Monday at 06:00 UTC
    - cron: '0 6 * * 1'

jobs:
  unit:
    name: Offline unit tests (Python 3.14)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Match the Python version used in the project (see Dockerfile / README)
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}-minimal
          restore-keys: |
            ${{ runner.os }}-pip-minimal-

      - name: Install test dependencies (minimal — no torch/sentence-transformers)
        # requirements-dev.txt is the single source of truth for the unit-test
        # subset.  Full requirements.txt (~4 GB torch/sentence-transformers) is
        # only needed for integration/production installs.
        run: pip install -r requirements-dev.txt

      - name: Run offline unit tests with coverage
        run: |
          pytest -m "not integration" \
            --cov=project \
            --cov-report=term \
            --cov-fail-under=18 \
            -v

  # Integration tests are opt-in (workflow_dispatch only).
  # They require a running Ollama + Qdrant instance, which is not available in
  # standard CI runners.  Trigger manually on a self-hosted runner that has
  # OLLAMA_BASE_URL, QDRANT_DB_PATH, and optionally LANGFUSE_* set.
  integration:
    name: Integration tests (manual trigger only)
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install all dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run integration tests
        env:
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
          QDRANT_DB_PATH: ${{ vars.QDRANT_DB_PATH }}
          LANGFUSE_ENABLED: ${{ vars.LANGFUSE_ENABLED }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
        run: |
          pytest -m integration -v
