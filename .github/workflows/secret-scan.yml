# Blocking secret scan.
#
# This repository is PUBLIC and the working tree contains a live credentials file
# (project/.env). Before this workflow, the only thing standing between that file and
# publication was a single .gitignore line: a `git add -f`, a rename, or a new path
# would have leaked it with no gate firing. quality.yml is advisory by design (every
# step is continue-on-error), and CodeQL does not look for secrets.
#
# This check is deliberately NOT continue-on-error — it is meant to fail the PR.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Catch a secret that reached main outside a PR, and newly-added detector rules.
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks needs history to scan the commits a PR introduces, not just the tip.
          fetch-depth: 0

      # Pinned to a full commit SHA like every other action in this repo — a mutable tag
      # on a security check is the thing the check exists to prevent.
      # gitleaks-action v2 is free for personal and public repositories; moving this repo
      # under an organisation would require GITLEAKS_LICENSE.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
