name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # `assigned` removed: on that activity the payload's issue.author_association is the
  # OPENER's standing, not the assigner's, so the gate below would check the wrong
  # principal. The action happens to no-op on `assigned` today (its body/title trigger
  # scan is gated to `opened`, and no assignee_trigger is configured), so this was
  # latent rather than live — but the trigger buys nothing, so it goes.
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Two independent gates, because this repository is PUBLIC and the trigger events
    # below can be fired by anyone with a GitHub account:
    #
    # 1. Trust gate. Without it, opening an issue whose body contains "@claude" was
    #    enough for a stranger to start an agent with a shell on our infrastructure.
    #    author_association is computed by GitHub from the actor's real relationship to
    #    the repository, so it cannot be set by the payload author.
    # 2. Runner. This job runs on a GitHub-hosted ephemeral VM, not the lab's
    #    self-hosted runner. GitHub's own guidance is that self-hosted runners should
    #    only be used with private repositories: they are not ephemeral by default, so
    #    untrusted code that reaches one can persist between jobs and stay resident on
    #    the machine. Do not move this back to `self-hosted` while the repo is public.
    #
    # Scope of gate 1, stated honestly: it protects THIS workflow. It cannot protect the
    # runner itself, because a `pull_request` run executes the workflow file from the
    # PR's merge commit, which the fork author controls — so any registered self-hosted
    # runner stays reachable by adding a new workflow, no matter what this file says.
    # The durable fix is to deregister the runner (or require approval for ALL outside
    # contributors, not just first-time ones); see the note in tests.yml.
    # The association is checked against the actor of THAT event, never OR-ed across
    # events: on issue_comment the payload also carries the issue author's association,
    # so a blanket OR would let a stranger's "@claude" comment on a collaborator's issue
    # through on the issue author's standing.
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # Isolate CI from the runner operator's personal Claude config.
      # The action resolves config from $HOME/.claude, so we point HOME at a
      # per-job temp dir: the run is clean and reproducible and no one's
      # ~/.claude is read or mutated. $RUNNER_TEMP avoids a hardcoded path;
      # it is exported via $GITHUB_ENV because the runner context is not
      # available in a job-level env block. HOME then applies to all later steps.
      - name: Isolate Claude config
        run: |
          mkdir -p "$RUNNER_TEMP/claude-home"
          echo "HOME=$RUNNER_TEMP/claude-home" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The langfuse MCP server in .mcp.json runs via uvx, which GitHub-hosted
      # runners do not preinstall.
      - name: Install uv (for langfuse MCP)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@8251c103ac8c1d761882c86aba1412c7f583c844 # v1
        # .mcp.json expands ${LANGFUSE_*} from the process environment; repository
        # secrets only exist inside a workflow run and only where mapped explicitly.
        # The action loads and trusts the project .mcp.json on its own, but MCP
        # tools still need an explicit allow (mcp__<server>__* below).
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Allow Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          claude_args: '--allowedTools "mcp__langfuse__*"'
