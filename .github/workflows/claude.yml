name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # Isolate CI from the runner operator's personal Claude config.
      # The action resolves config from $HOME/.claude, so we point HOME at a
      # per-job temp dir: the run is clean and reproducible and no one's
      # ~/.claude is read or mutated. $RUNNER_TEMP avoids a hardcoded path;
      # it is exported via $GITHUB_ENV because the runner context is not
      # available in a job-level env block. HOME then applies to all later steps.
      - name: Isolate Claude config
        run: |
          mkdir -p "$RUNNER_TEMP/claude-home"
          echo "HOME=$RUNNER_TEMP/claude-home" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Allow Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: customize behavior via claude_args
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # claude_args: '--allowed-tools Bash(gh pr *)'
