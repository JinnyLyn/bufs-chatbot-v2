# Manual compile-test of the legacy container image.
# The image installs ~4 GB torch + Ollama — far too heavy for per-PR CI.
# Trigger manually via GitHub Actions → "Docker build-check (manual)" → Run workflow.
name: Docker build-check (manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build legacy Docker image (no push)
        run: docker build -f project/Dockerfile -t bufs-legacy:ci .
