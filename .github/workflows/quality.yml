# Advisory lint & type checks — these steps NEVER block a PR merge.
# All steps use continue-on-error: true intentionally.
# Future: promote to required + ratchet coverage once violations are fixed.
name: Lint & Types (advisory)

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint & type check (advisory)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install lint tools
        # Pinned for reproducible CI (inline pins aren't Dependabot-tracked; bump intentionally).
        run: pip install ruff==0.15.11 mypy==2.1.0

      - name: Ruff lint check (advisory)
        continue-on-error: true
        run: ruff check project tests

      - name: Ruff format check (advisory)
        continue-on-error: true
        run: ruff format --check project tests

      - name: Mypy type check (advisory)
        continue-on-error: true
        run: mypy project
