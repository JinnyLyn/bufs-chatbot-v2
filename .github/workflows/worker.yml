name: Worker CI

on:
  pull_request:
    paths:
      - 'worker/**'
      # contacts-sync.test.mjs compares worker/src/pages.js against this file, so a
      # frontend-only contact edit must also trigger the drift check.
      - 'frontend/src/lib/constants.ts'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # No dependencies: the Worker is plain ESM and the tests use node's built-in runner.
      - name: Syntax check
        run: node --check src/index.js && node --check src/pages.js

      - name: Unit tests
        run: npm test
