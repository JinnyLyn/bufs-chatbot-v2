# Dependabot PR 자동 머지.
#
# Dependabot 이 연 PR 중 minor/patch 묶음은 사람이 안 봐도 된다: 필수 CI(유닛 테스트·gitleaks·
# CodeQL)가 초록이면 GitHub 가 알아서 squash 머지한다. 머지돼도 사용자한텐 아무 일 없다 —
# main 만 앞서가고, 다음 릴리스 때 staging 을 거쳐 태그로 나간다 (RELEASE.md).
#
# major 는 그대로 사람 몫: 코멘트만 남기고 기다린다. 묶음 PR 의 update-type 은 묶음 안에서
# 가장 큰 변경 기준이라, major 가 하나라도 섞이면 묶음 전체가 사람을 기다린다.
#
# 동작 조건 (둘 다 저장소 설정): "Allow auto-merge" 켜짐 + main 규칙에 필수 status check.
# 필수 체크가 없으면 `gh pr merge --auto` 가 거부된다 — 기다릴 조건이 없으니까.
#
# Dependabot 이 트리거한 워크플로우의 GITHUB_TOKEN 은 기본 읽기 전용이라 permissions 로
# 올린다 (GitHub 공식 auto-merge 예제와 같은 방식). 다른 secret 은 어차피 안 보인다.
name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: minor/patch 자동 머지
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot 메타데이터 (update-type)
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: minor/patch → auto-merge 켜기 (필수 체크가 초록이 되면 GitHub 가 머지)
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # opened/reopened 에서만: Dependabot 이 rebase 할 때마다 synchronize 가 다시 오는데,
      # 그때마다 같은 코멘트를 또 달면 안 된다 (auto-merge 단계는 여러 번 돌아도 무해).
      - name: major → 사람 리뷰 대기 코멘트
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-major' &&
          (github.event.action == 'opened' || github.event.action == 'reopened')
        run: >-
          gh pr comment "$PR_URL" --body
          "major 버전 올림 — 자동 머지 대상 아님. @JinnyLyn 가 소비 코드와 변경 사항을 보고 결정 (WORKFLOW.md 'Dependabot')."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
