# cloudflared ingress for the H100 box — Linux port of logs/cf-config-new.yml.
#
# Copy to ~/.cloudflared/config.yml on the H100, then fill in the NEW tunnel's UUID
# (the Windows box used a different tunnel; its credentials JSON lived outside the repo
# under C:\ProgramData\Cloudflared\ and was NOT part of the zip you scp'd).
#
#   cloudflared tunnel list                       # find the new tunnel's UUID
#   cloudflared tunnel route dns <uuid> maruvis.co.kr
#   cloudflared tunnel --config ~/.cloudflared/config.yml run <uuid>
#
# On the Windows box this ran as a Windows *service* (Restart-Service cloudflared) — that is
# why there was no Docker anywhere. On a shared Linux box without root, run it under systemd
# --user or tmux instead; see MIGRATION_H100.md.

tunnel: REPLACE-WITH-NEW-TUNNEL-UUID
credentials-file: /home/REPLACE-USER/.cloudflared/REPLACE-WITH-NEW-TUNNEL-UUID.json

ingress:
  # API + SSE (chat stream, session) -> FastAPI backend on :8000 (same origin -> no CORS).
  - hostname: maruvis.co.kr
    path: ^/api/
    service: http://localhost:8000
  # Everything else -> Next.js frontend on :3000.
  - hostname: maruvis.co.kr
    service: http://localhost:3000
  - service: http_status:404
