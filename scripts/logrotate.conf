# logrotate.conf — rotation for the append: logs the camchat units write (no root needed:
# run as the service user with its own state file). Triggered daily by
# camchat-logrotate.timer; run by hand with
#   logrotate -s logs/run/logrotate.state scripts/logrotate.conf
# copytruncate keeps the units' open file descriptors valid (no restart on rotation).
# Paths are relative to the repo via the timer's WorkingDirectory; logrotate wants
# absolute paths, so scripts/systemd/camchat-logrotate.service passes %h/camchat below.
/home/*/camchat/logs/backend/server.out
/home/*/camchat/logs/backend/server.err
/home/*/camchat/logs/frontend/frontend.out
/home/*/camchat/logs/frontend/frontend.err
/home/*/camchat/logs/ollama/ollama.out
/home/*/camchat/logs/ollama/ollama.err
/home/*/camchat/logs/healthcheck.log
/home/*/camchat/logs/alerts.log {
    size 50M
    rotate 5
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
