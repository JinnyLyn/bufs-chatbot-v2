# logrotate.conf — TEMPLATE for rotating the append: logs the camchat units write (no root
# needed: runs as the service user with its own state file). install-units.sh renders it
# with %h/camchat replaced by the real checkout path into logs/run/logrotate.conf, which
# camchat-logrotate.timer runs daily. By hand (after install):
#   logrotate -s logs/run/logrotate.state logs/run/logrotate.conf
# copytruncate keeps the units' open file descriptors valid (no restart on rotation).
%h/camchat/logs/backend/server.out
%h/camchat/logs/backend/server.err
%h/camchat/logs/frontend/frontend.out
%h/camchat/logs/frontend/frontend.err
%h/camchat/logs/ollama/ollama.out
%h/camchat/logs/ollama/ollama.err
%h/camchat/logs/healthcheck.log
%h/camchat/logs/alerts.log {
    size 50M
    rotate 5
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
